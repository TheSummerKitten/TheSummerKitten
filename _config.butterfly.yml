# Butterfly theme overrides

nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  GitHub: https://github.com/TheSummerKitten || fab fa-github

favicon: /img/site.ico

avatar:
  img: /img/Avatar.jpg
  effect: true

default_top_img: "linear-gradient(135deg, #ffd6e7 0%, #fff1c9 52%, #c9f4ff 100%)"
index_img: "linear-gradient(135deg, #ffd6e7 0%, #fff1c9 52%, #c9f4ff 100%)"
background: "linear-gradient(180deg, #fff7fb 0%, #f8fdff 52%, #fffaf0 100%)"

subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 猫的记录
    - The Summer Kitten

index_layout: 4

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/default-cover.jpg

aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 记录夏天、猫和一点点生活。
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/TheSummerKitten
  card_announcement:
    enable: true
    content: 欢迎来到 The Summer Kitten 的个人博客。

theme_color:
  enable: true
  main: "#ff8fbc"
  paginator: "#ff8fbc"
  button_hover: "#7bdff2"
  text_selection: "#ffe3ef"
  link_color: "#e86aa0"
  meta_color: "#8d8a95"
  hr_color: "#ffd6e7"
  code_foreground: "#e86aa0"
  code_background: "rgba(255, 214, 231, .28)"
  toc_color: "#ff8fbc"
  blockquote_padding_color: "#ffb6d2"
  blockquote_background_color: "rgba(255, 214, 231, .22)"
  scrollbar_color: "#ffb6d2"
  meta_theme_color_light: "#fff7fb"
  meta_theme_color_dark: "#1f1b24"

rounded_corners_ui: true
display_mode: light

font:
  global_font_size:
  code_font_size:
  font_family: '"Comic Sans MS", "YouYuan", "幼圆", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif'
  code_font_family: '"Cascadia Code", "Fira Code", Consolas, monospace'

blog_title_font:
  font_link:
  font_family: '"Comic Sans MS", "YouYuan", "幼圆", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif'

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: Made with Hexo & Butterfly.

inject:
  head:
    - <link rel="stylesheet" href="/TheSummerKitten/css/custom.css">
